<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">git-panic architecture</title><desc id="desc">A developer or shell-capable assistant invokes CLI dispatch. Timeline and search read the local HEAD reflog. Recovery validates a local commit and unused branch name, previews without writing, and creates a new branch only with explicit opt-in. Search and recovery can return JSON. HEAD, index, and working files stay unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><rect x="1" y="1" width="1198" height="698" rx="22" fill="#10141e" stroke="#374151"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><text x="48" y="46" text-anchor="start" fill="#fb923c" font-size="17" letter-spacing="3">GIT-PANIC / ARCHITECTURE</text><text x="1150" y="46" text-anchor="end" fill="#94a3b8" font-size="16">src/main.rs</text><rect x="390" y="72" width="420" height="52" rx="12" fill="#29213f" stroke="#a78bfa"/><text x="600" y="105" fill="#ede9fe" font-size="21">Developer / shell-capable assistant</text><rect x="425" y="155" width="350" height="58" rx="12" fill="#192a41" stroke="#60a5fa"/><text x="600" y="190" fill="#dbeafe" font-size="23">CLI dispatch</text><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"><path d="M600 124V155"/><path d="M500 213V240H220V271"/><path d="M600 213V271"/><path d="M700 213V240H980V271"/></g><g fill="#192a41" stroke="#60a5fa"><rect x="60" y="272" width="320" height="90" rx="12"/><rect x="440" y="272" width="320" height="90" rx="12"/><rect x="820" y="272" width="320" height="90" rx="12"/></g><g fill="#dbeafe" font-size="23"><text x="220" y="308">Timeline inspector</text><text x="600" y="308">Literal search</text><text x="980" y="308">Recovery</text></g><g fill="#a9b8cc" font-size="17"><text x="220" y="340">Read-only interactive view</text><text x="600" y="340">Case-insensitive message filter</text><text x="980" y="340">Validate commit + branch name</text></g><g fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"><path d="M220 362V420"/><path d="M600 362V390H360V420"/><path d="M980 362V420"/></g><rect x="60" y="421" width="700" height="86" rx="12" fill="#332719" stroke="#fbbf24"/><text x="410" y="457" fill="#fef3c7" font-size="23">Local Git repository</text><text x="410" y="488" fill="#d7c5a5" font-size="18">HEAD reflog for discovery / existing commits for recovery</text><path d="M820 462H760" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="820" y="421" width="320" height="86" rx="12" fill="#153029" stroke="#4ade80"/><text x="980" y="457" fill="#dcfce7" font-size="23">Preview first</text><text x="980" y="488" fill="#acd4c2" font-size="18">No writes without --create</text><path d="M980 507V553" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/><text x="965" y="536" text-anchor="end" fill="#86efac" font-size="16">explicit --create</text><rect x="820" y="554" width="320" height="63" rx="12" fill="#153029" stroke="#4ade80"/><text x="980" y="593" fill="#dcfce7" font-size="22">Create new branch reference</text><rect x="60" y="554" width="700" height="63" rx="12" fill="#1c2535" stroke="#64748b"/><text x="410" y="581" fill="#e2e8f0" font-size="20">Search + recovery: human-readable output or --json</text><text x="410" y="606" fill="#a9b8cc" font-size="16">The interactive timeline does not provide JSON output.</text><text x="600" y="664" fill="#fdba74" font-size="20">No checkout. No reset. HEAD, index, and working files stay unchanged.</text></g></svg>
