<a href="https://github.com/dudesquad999/git-panic/blob/main/src/main.rs"><rect class="node blue" x="530" y="245" width="240" height="70" rx="10"/><text class="label" x="650" y="274" fill="#dbeafe">Timeline inspector</text><text class="file" x="650" y="300" fill="#93c5fd">[main.rs]</text></a>
<a href="https://github.com/dudesquad999/git-panic/blob/main/src/main.rs"><rect class="node blue" x="980" y="245" width="240" height="70" rx="10"/><text class="label" x="1100" y="274" fill="#dbeafe">JSON responses</text><text class="file" x="1100" y="300" fill="#93c5fd">[main.rs]</text></a>
<a href="https://github.com/dudesquad999/git-panic/blob/main/src/main.rs"><rect class="node amber" x="130" y="550" width="240" height="70" rx="10"/><text class="label" x="250" y="579" fill="#fef3c7">Literal search</text><text class="file" x="250" y="605" fill="#fcd34d">[main.rs]</text></a>
<a href="https://github.com/dudesquad999/git-panic/blob/main/src/main.rs"><rect class="node amber" x="130" y="715" width="240" height="70" rx="10"/><text class="label" x="250" y="744" fill="#fef3c7">HEAD reflog</text><text class="file" x="250" y="770" fill="#fcd34d">[main.rs]</text></a>
<path class="node amber" d="M330 860C330 836 570 836 570 860V910C570 934 330 934 330 910Z"/><ellipse cx="450" cy="860" rx="120" ry="13" fill="#362919" stroke="#fbbf24" stroke-width="1.7"/><text class="label" x="450" y="901" fill="#fef3c7">Local Git repository</text>
<a href="https://github.com/dudesquad999/git-panic/blob/main/src/main.rs"><rect class="node mint" x="930" y="550" width="240" height="70" rx="10"/><text class="label" x="1050" y="579" fill="#dcfce7">Recovery preview</text><text class="file" x="1050" y="605" fill="#86efac">[main.rs]</text></a>
<a href="https://github.com/dudesquad999/git-panic/blob/main/src/main.rs"><rect class="node mint" x="930" y="790" width="240" height="70" rx="10"/><text class="label" x="1050" y="819" fill="#dcfce7">Branch creation</text><text class="file" x="1050" y="845" fill="#86efac">[main.rs]</text></a>
</g>
</svg>
