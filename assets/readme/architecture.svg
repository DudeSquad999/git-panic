<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc">
<title id="title">git-panic architecture</title><desc id="desc">Nine nodes and eleven labeled arrows. CLI interfaces: command dispatch, timeline inspector, JSON responses. Commit discovery: literal search, HEAD reflog, local Git repository. Commit preservation: recovery preview and branch creation. A developer or assistant invokes command dispatch.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif;text-anchor:middle}.group{fill:#161c28;stroke:#394354;stroke-width:1.5}.heading{font-size:23px;fill:#fdba74;font-weight:700}.node{stroke-width:1.7}.blue{fill:#192e49;stroke:#60a5fa}.amber{fill:#362919;stroke:#fbbf24}.mint{fill:#15372c;stroke:#4ade80}.label{font-size:21px}.file{font-size:17px}.edge{fill:none;stroke:#94a3b8;stroke-width:1.8;marker-end:url(#arrow)}.edge-label{font-size:17px;fill:#d7dfeb;paint-order:stroke;stroke:#10141e;stroke-width:7px;stroke-linejoin:round}</style>
<rect x="1" y="1" width="1398" height="1058" rx="24" fill="#10141e" stroke="#394354"/>
<text x="48" y="42" text-anchor="start" fill="#fb923c" font-size="17" letter-spacing="3">GIT-PANIC / ARCHITECTURE</text><text x="1350" y="42" text-anchor="end" fill="#94a3b8" font-size="16">LOCAL GIT / EXPLICIT RECOVERY</text>
<g transform="translate(0 40)">
<rect class="group" x="80" y="190" width="1240" height="170" rx="16"/><text class="heading" x="700" y="222">CLI interfaces</text>
<rect class="group" x="80" y="490" width="560" height="480" rx="16"/><text class="heading" x="360" y="522">Commit discovery</text>
<rect class="group" x="800" y="490" width="500" height="480" rx="16"/><text class="heading" x="1050" y="522">Commit preservation</text>
<g><path class="edge" d="M250 120V245"/><text class="edge-label" x="290" y="165">invokes</text>
<path class="edge" d="M130 280H40V750H130"/><text class="edge-label" x="40" y="460" transform="rotate(-90 40 460)">reads</text>
<path class="edge" d="M450 849V750H370"/><text class="edge-label" x="480" y="800">provides entries</text>
<path class="edge" d="M250 315V550"/><text class="edge-label" x="240" y="405" text-anchor="end">routes query</text>
<path class="edge" d="M250 620V715"/><text class="edge-label" x="320" y="673">filters entries</text>
<path class="edge" d="M370 280H530"/><text class="edge-label" x="450" y="267">opens timeline</text>
<path class="edge" d="M310 315V435H1050V550"/><text class="edge-label" x="850" y="422">routes request</text>
<path class="edge" d="M1010 620V680H700V885H570"/><text class="edge-label" x="820" y="667">validates commit</text>
<path class="edge" d="M1050 620V790"/><text class="edge-label" x="1140" y="716">creates on opt-in</text>
<path class="edge" d="M370 585H720V395H1100V315"/><text class="edge-label" x="900" y="382">formats results</text>
<path class="edge" d="M1170 585H1360V280H1220"/><text class="edge-label" x="1360" y="430" transform="rotate(-90 1360 430)">formats response</text></g>
<ellipse cx="250" cy="75" rx="145" ry="45" fill="#29213f" stroke="#a78bfa" stroke-width="1.7"/><ellipse cx="250" cy="75" rx="138" ry="38" fill="none" stroke="#a78bfa" stroke-opacity=".45"/><text x="250" y="82" class="label" fill="#ede9fe">Developer / assistant</text>
