<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Prism Git Panic — local Git recovery</title>
  <desc id="desc">A Prism-branded developer tool banner showing the faceted prism mark, git-panic name, and an illustrative recovery workflow on a terminal card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080D1A"/><stop offset=".55" stop-color="#0A1020"/><stop offset="1" stop-color="#111A35"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9B5CFF"/><stop offset=".55" stop-color="#5A45F5"/><stop offset="1" stop-color="#176BFF"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5425D8"/><stop offset=".65" stop-color="#2149D8"/><stop offset="1" stop-color="#13B8D4"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#176BFF"/><stop offset=".55" stop-color="#3551ED"/><stop offset="1" stop-color="#943DFF"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16CED0"/><stop offset=".48" stop-color="#3453EF"/><stop offset="1" stop-color="#8B3DFA"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9B5CFF" stop-opacity=".22"/><stop offset="1" stop-color="#13B8D4" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#26345A" stroke-width="1" opacity=".45"/></pattern>
  </defs>
  <rect width="1440" height="560" fill="url(#bg)"/>
  <rect width="1440" height="560" fill="url(#grid)" opacity=".8"/>
  <ellipse cx="320" cy="280" rx="360" ry="270" fill="url(#glow)"/>
  <g transform="translate(82 102) scale(.66)">
    <path d="M256 28 466 150 354 208 256 151 158 208 46 150Z" fill="url(#top)"/>
    <path d="M46 150 158 208 158 330 256 387 256 484 46 362Z" fill="url(#left)"/>
    <path d="M466 150 354 208 354 330 256 387 256 484 466 362Z" fill="url(#right)"/>
    <path d="M158 330 256 387 354 330 466 362 256 484 46 362Z" fill="url(#base)" opacity=".94"/>
    <path d="M256 151 354 208 256 265 158 208Z" fill="#0A1020"/>
  </g>
  <text x="88" y="430" fill="#9B5CFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5">PRISM LABS  /  DEVELOPER TOOLS</text>
  <text x="500" y="188" fill="#F6F8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="-2">git-panic</text>
  <text x="504" y="238" fill="#B6C2E2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600">Local Git recovery. One deliberate branch at a time.</text>
  <text x="504" y="286" fill="#9B5CFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Find the commit. Preserve it. Decide what happens next.</text>
  <g transform="translate(500 330)">
    <rect width="858" height="166" rx="20" fill="#0A1020" stroke="#303C5B" stroke-width="2"/>
    <path d="M0 44H858" stroke="#303C5B"/>
    <circle cx="28" cy="22" r="6" fill="#9B5CFF"/><circle cx="50" cy="22" r="6" fill="#176BFF"/><circle cx="72" cy="22" r="6" fill="#13B8D4"/>
    <text x="108" y="28" fill="#B6C2E2" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2">ILLUSTRATIVE CLI FLOW  •  NOT A SCREENSHOT</text>
    <text x="30" y="80" fill="#9B5CFF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20">$ git-panic recover &lt;SHA&gt; --branch recovery/saved</text>
    <text x="30" y="112" fill="#F6F8FF" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">Preview only. Nothing written.</text>
    <text x="30" y="142" fill="#13B8D4" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18">Add --create only after reviewing the preview.</text>
  </g>
</svg>