name: Feature request
description: Propose a focused improvement to git-panic.
title: "[Feature]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and documentation.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user workflow, not only the proposed feature.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include example commands or interactions if useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain why existing Git or git-panic commands are insufficient.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Safety and compatibility
      description: |
        Would this write repository state, change CLI or JSON behavior,
        require network access, or affect the preview-first workflow?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted examples or relevant links.
