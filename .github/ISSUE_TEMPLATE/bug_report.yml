name: Bug report
description: Report unexpected behavior or a build failure.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, private repository content, or unredacted
        reflogs. For suspected vulnerabilities, read SECURITY.md first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed sensitive information from this report.
          required: true

  - type: input
    id: version
    attributes:
      label: git-panic version or commit
      description: Use git-panic --version or provide the source commit.
      placeholder: "git-panic 0.1.0 / commit SHA"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment and installation
      description: |
        Include OS version, terminal, installation method, and git --version.
        For build failures, include rustc --version and cargo --version.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a disposable repository, never a destructive test in real work.
      placeholder: |
        1. Create a disposable repository.
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit status if available.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant command and output
      description: Include the first relevant error and redact sensitive data.
      render: text
