name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup override set stable
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Tests in isolated temporary repositories
        run: cargo test --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Inspect package contents
        run: cargo package --list

  msrv:
    name: Minimum supported Rust (1.88.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Test using the declared minimum
        run: cargo +1.88.0 test --all-targets --locked
      - name: Build release using the declared minimum
        run: cargo +1.88.0 build --release --locked
