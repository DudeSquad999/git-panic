name: Repair Dependabot alert 2

on:
  push:
    branches: [fix/dependabot-2-lru]
    paths: [.github/workflows/repair-dependabot-2.yml]

permissions:
  contents: write

concurrency:
  group: repair-dependabot-2
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'DudeSquad999/git-panic' && github.ref == 'refs/heads/fix/dependabot-2-lru'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependabot-2-lru
          persist-credentials: true
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup override set stable
          rustc --version
          cargo --version
      - name: Apply dependency and API migration
        shell: python
        run: |
          from pathlib import Path
          manifest_path = Path("Cargo.toml")
          source_path = Path("src/main.rs")
          manifest = manifest_path.read_text()
          source = source_path.read_text()
          replacements = {
              'ratatui = "0.26"': 'ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm_0_29"] }',
              'crossterm = "0.27"': 'crossterm = "0.29"',
          }
          for old, new in replacements.items():
              if manifest.count(old) == 1:
                  manifest = manifest.replace(old, new)
              elif manifest.count(new) != 1:
                  raise SystemExit(f"Unexpected manifest content: {old}")
          if "frame.size()" in source:
              source = source.replace("frame.size()", "frame.area()")
          elif "frame.area()" not in source:
              raise SystemExit("Unexpected frame API; inspect manually")
          manifest_path.write_text(manifest)
          source_path.write_text(source)
      - name: Regenerate dependency lockfile with Cargo
        run: cargo generate-lockfile
      - name: Verify lru is outside known vulnerable versions
        shell: python
        run: |
          import tomllib
          from pathlib import Path
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          versions = [p["version"] for p in packages if p["name"] == "lru"]
          if not versions:
              raise SystemExit("Expected Ratatui to resolve its lru dependency; review dependency graph.")
          def version_tuple(value):
              return tuple(int(part) for part in value.split(".")[:3])
          unsafe = [version for version in versions if version_tuple(version) < (0, 18, 2)]
          if unsafe:
              raise SystemExit(f"lru versions below the 0.18.2 security floor remain: {unsafe}")
          print(f"Verified safe lru versions: {versions}")
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --all-targets --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --release --locked
      - name: Verify declared minimum Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 test --all-targets --locked
      - name: Verify diff
        run: git diff --check
      - name: Upload repair files for review
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-2-repair-files
          path: |
            Cargo.toml
            Cargo.lock
            src/main.rs
      - name: Commit verified repair to fix branch only
        run: |
          git add -- Cargo.toml Cargo.lock src/main.rs
          if git diff --cached --quiet; then
            echo "Repair already committed; no new commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: upgrade dependencies beyond vulnerable lru versions"
          git push origin HEAD:refs/heads/fix/dependabot-2-lru
