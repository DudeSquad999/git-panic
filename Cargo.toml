[package]
name = "git-panic"
version = "0.1.0"
edition = "2021"
authors = ["Git-Panic Contributors"]
description = "Visual Git Reflog Time Machine & Disaster Recovery CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/your-org/git-panic"
keywords = ["git", "cli", "tui", "recovery", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
git2 = "0.18"
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
