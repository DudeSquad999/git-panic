[package]
name = "git-panic"
version = "0.1.0"
edition = "2021"
authors = ["DudeSquad999 <dudesquad999@users.noreply.github.com>"]
description = "Visual Git Reflog Time Machine & Disaster Recovery CLI"
# Verified floor: 1.88.0 builds and tests cleanly; 1.87.0 cannot resolve the
# committed lockfile (several resolved dependencies require >= 1.88).
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DudeSquad999/git-panic"
keywords = ["git", "cli", "tui", "recovery", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
# No SSH/HTTPS support is needed: git-panic only reads local repositories
# and never performs network or remote operations. Disabling git2's default
# features also removes the openssl-sys/libssh2-sys build requirements.
git2 = { version = "0.20", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "crossterm_0_29"] }
crossterm = "0.29"
anyhow = "1.0"
# Used only for the documented --json output of search and recover
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
