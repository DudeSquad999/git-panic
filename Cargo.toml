[package]
name = "git-panic"
version = "0.1.0"
edition = "2021"
authors = ["DudeSquad999 <dudesquad999@users.noreply.github.com>"]
description = "Visual Git Reflog Time Machine & Disaster Recovery CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DudeSquad999/git-panic"
keywords = ["git", "cli", "tui", "recovery", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
# No SSH/HTTPS support is needed: git-panic only reads local repositories
# and never performs network or remote operations. Disabling git2's default
# features also removes the openssl-sys/libssh2-sys build requirements.
git2 = { version = "0.20", default-features = false }
ratatui = "0.26"
crossterm = "0.27"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
